name: Release Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (例如 v0.2.14，留空则自动提取 package.json 中的版本)'
        required: false
        type: string
      draft:
        description: '是否发布为草稿 (Draft)'
        required: false
        type: boolean
        default: false
      prerelease:
        description: '是否标记为预发布 (Pre-release)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Disable Git CRLF Auto-conversion
        run: git config --global core.autocrlf false

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Pre-build Artifacts
        run: node -e "require('./scripts/build-installer.cjs').verifyArtifacts(); console.log('Pre-build artifacts verification passed.');"

      - name: Build Windows Installer
        run: npm run build:installer

      - name: Determine Release Tag and Metadata
        id: meta
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          INPUT_TAG="${{ inputs.tag_name }}"
          
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v$PKG_VERSION"
          fi
          
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$PKG_VERSION" >> $GITHUB_OUTPUT
          echo "title=千面 Facet $TAG" >> $GITHUB_OUTPUT
          echo "Release Tag: $TAG"

      - name: Inspect Build Outputs
        shell: bash
        run: |
          echo "==> release 目录内容:"
          ls -la release/

      - name: Upload Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: facet-installer-${{ steps.meta.outputs.tag }}
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/*.exe.sha256
            release/latest.yml
          retention-days: 14

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/*.exe.sha256
            release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
